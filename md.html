<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown szerkesztő</title>
<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel-2:#f7f8fa; --text:#1c2024; --muted:#6a7280;
  --border:#dfe3e8; --accent:#1f6f8b; --accent-soft:#e3eff3; --code-bg:#f1f3f6;
  --sel:#cfe6ef; --hl-mark:#1f6f8b; --hl-head:#155163; --hl-quote:#6a7280;
  --hl-code:#8a5a2b; --hl-link:#3a6ea5;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Source Serif Pro",Charter,Georgia,Cambria,serif;
  --ed-size:13.5px; --ed-lh:1.85;
}
html[data-theme="dark"]{
  --bg:#14171a; --panel:#1a1e22; --panel-2:#1f2429; --text:#dfe3e7; --muted:#8b949e;
  --border:#2b3238; --accent:#6fb3c9; --accent-soft:#1d2b31; --code-bg:#22282e;
  --sel:#2c4650; --hl-mark:#6fb3c9; --hl-head:#8ecadd; --hl-quote:#8b949e;
  --hl-code:#d3a06a; --hl-link:#89b4e8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:14px; display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}

/* fejléc */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--border);flex:0 0 auto}
.doc{display:flex;align-items:center;gap:8px;min-width:0}
.doc .mk{font-family:var(--mono);font-size:12px;color:var(--accent);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--panel)}
#name{font:500 14px var(--sans);color:var(--text);background:none;border:1px solid transparent;
  border-radius:5px;padding:3px 6px;min-width:60px;max-width:34vw}
#name:hover{border-color:var(--border);background:var(--panel)}
#name:focus{border-color:var(--accent);background:var(--panel);outline:none}
.dirty{font-size:12px;color:var(--muted);white-space:nowrap}
.acts{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:7px;background:var(--panel)}
.seg button{font-size:12px;padding:4px 9px;border-radius:5px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.ib{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--panel);color:var(--text)}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* eszköztár */
.bar{display:flex;align-items:center;gap:1px;padding:5px 8px;background:var(--panel);
  border-bottom:1px solid var(--border);flex:0 0 auto;flex-wrap:wrap}
.bar button{min-width:30px;height:28px;padding:0 6px;border-radius:6px;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.bar button:hover{background:var(--panel-2);color:var(--text)}
.bar .lbl{font-weight:500;font-size:12.5px;letter-spacing:.2px}
.sep{width:1px;height:18px;background:var(--border);margin:0 7px}
.hint{margin-left:auto;font-size:11.5px;color:var(--muted);font-family:var(--mono);padding-right:4px}
.menu-wrap{position:relative}
.menu{position:absolute;top:32px;left:0;z-index:20;background:var(--panel);
  border:1px solid var(--border);border-radius:8px;padding:4px;min-width:172px;
  box-shadow:0 6px 20px rgba(0,0,0,.12)}
html[data-theme="dark"] .menu{box-shadow:0 6px 20px rgba(0,0,0,.5)}
.menu[hidden]{display:none}
.menu button{display:flex;width:100%;justify-content:space-between;align-items:center;
  height:30px;padding:0 8px;border-radius:5px;color:var(--text);font-size:13px}
.menu button:hover{background:var(--panel-2)}
.menu kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:0}
.menu .h1{font-size:16px;font-weight:500}.menu .h2{font-size:15px;font-weight:500}
.menu .h3{font-size:14px;font-weight:500}.menu .h4,.menu .h5,.menu .h6{font-size:13px}

/* munkaterület */
.main{flex:1 1 auto;display:flex;min-height:0;background:var(--panel)}
.pane{display:flex;flex-direction:column;min-width:0;flex:1 1 50%}
.pane-head{display:flex;align-items:center;gap:6px;padding:5px 12px;font-size:11.5px;
  color:var(--muted);border-bottom:1px solid var(--border);flex:0 0 auto}
#src{border-right:1px solid var(--border)}
body[data-view="editor"] #prev{display:none}
body[data-view="editor"] #src{flex-basis:100%}
body[data-view="preview"] #src{display:none}
body[data-view="preview"] #prev{flex-basis:100%}

/* szerkesztő */
.edit{position:relative;flex:1 1 auto;display:flex;min-height:0;overflow:hidden}
.gutter{width:46px;flex:0 0 46px;position:relative;overflow:hidden;
  border-right:1px solid var(--border);background:var(--panel-2)}
.gutter-inner{position:absolute;top:0;left:0;right:0;will-change:transform}
.gutter-inner span{position:absolute;right:10px;font-family:var(--mono);
  font-size:var(--ed-size);line-height:var(--ed-lh);color:var(--muted);opacity:.7}
.field{position:relative;flex:1 1 auto;min-width:0;overflow:hidden}
#ta,.mirror{
  font-family:var(--mono);font-size:var(--ed-size);line-height:var(--ed-lh);
  padding:10px 14px;border:0;margin:0;white-space:pre-wrap;overflow-wrap:break-word;
  word-break:normal;tab-size:2;letter-spacing:0;
}
.mirror{position:absolute;inset:0;pointer-events:none;color:var(--text);
  will-change:transform;transform-origin:0 0}
.mirror div{min-height:1px}
#ta{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;
  color:transparent;caret-color:var(--accent);overflow-y:auto;outline:none;display:block}
#ta::selection{background:var(--sel)}
#ta::-webkit-scrollbar{width:0;height:0}
#ta{scrollbar-width:none}
.hl-head{color:var(--hl-head)}
.hl-mark{color:var(--hl-mark)}
.hl-quote{color:var(--hl-quote)}
.hl-code{color:var(--hl-code)}
.hl-link{color:var(--hl-link)}

/* előnézet */
.preview{flex:1 1 auto;overflow-y:auto;padding:18px 26px 60vh}
.preview .doc-body{max-width:68ch;font-family:var(--serif);font-size:15.5px;line-height:1.75}
.preview h1,.preview h2,.preview h3,.preview h4,.preview h5,.preview h6{
  font-family:var(--sans);line-height:1.3;margin:1.6em 0 .5em;font-weight:600}
.preview h1{font-size:1.72em;margin-top:0;padding-bottom:.25em;border-bottom:1px solid var(--border)}
.preview h2{font-size:1.36em;padding-bottom:.2em;border-bottom:1px solid var(--border)}
.preview h3{font-size:1.16em}.preview h4{font-size:1em}
.preview h5{font-size:.92em;color:var(--muted)}.preview h6{font-size:.86em;color:var(--muted)}
.preview p{margin:0 0 1em}
.preview a{color:var(--accent)}
.preview ul,.preview ol{margin:0 0 1em;padding-left:1.5em}
.preview li{margin:.2em 0}
.preview li.task{list-style:none;margin-left:-1.35em}
.preview li.task input{margin-right:.5em;accent-color:var(--accent)}
.preview blockquote{margin:0 0 1em;padding:.1em 0 .1em 1em;border-left:3px solid var(--border);color:var(--muted)}
.preview blockquote p:last-child{margin-bottom:0}
.preview code{font-family:var(--mono);font-size:.85em;background:var(--code-bg);
  padding:.15em .4em;border-radius:4px}
.preview pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;overflow-x:auto;margin:0 0 1em}
.preview pre code{background:none;padding:0;font-size:.84em;line-height:1.6}
.preview hr{border:0;border-top:1px solid var(--border);margin:1.8em 0}
.preview img{max-width:100%;border-radius:6px}
.preview table{border-collapse:collapse;margin:0 0 1em;font-family:var(--sans);
  font-size:.92em;display:block;overflow-x:auto}
.preview th,.preview td{border:1px solid var(--border);padding:6px 11px;text-align:left}
.preview th{background:var(--panel-2);font-weight:600}
.preview .empty{color:var(--muted);font-family:var(--sans);font-size:14px}

/* állapotsor */
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:5px 12px;background:var(--panel-2);border-top:1px solid var(--border);
  font-size:11.5px;color:var(--muted);flex:0 0 auto}
.drop{position:absolute;inset:0;z-index:30;display:none;place-items:center;
  background:var(--accent-soft);border:2px dashed var(--accent);color:var(--accent);font-weight:500}
body.dragging .drop{display:grid}
@media (max-width:820px){
  .main{flex-direction:column}
  #src{border-right:0;border-bottom:1px solid var(--border)}
  .hint{display:none}
  .preview{padding:16px 18px 40vh}
}
</style>
</head>
<body data-view="split">

<header class="top">
  <div class="doc">
    <span class="mk">md</span>
    <input id="name" value="jegyzet.md" aria-label="Fájlnév" spellcheck="false">
    <span class="dirty" id="dirty">nincs mentve</span>
  </div>
  <div class="acts">
    <div class="seg" role="group" aria-label="Nézet">
      <button data-view="editor" aria-pressed="false">Szerkesztő</button>
      <button data-view="split" aria-pressed="true">Osztott</button>
      <button data-view="preview" aria-pressed="false">Előnézet</button>
    </div>
    <button class="ib" id="open" title="Megnyitás" aria-label="Fájl megnyitása">
      <svg width="17" height="17" viewBox="0 0 20 20"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h3.2l1.4 1.8h8.4A1.5 1.5 0 0 1 18 7.3v7.2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 2 14.5z"/></svg>
    </button>
    <button class="ib" id="save" title="Letöltés (Ctrl+S)" aria-label="Letöltés">
      <svg width="17" height="17" viewBox="0 0 20 20"><path d="M10 3v9"/><path d="M6.2 8.4 10 12.2l3.8-3.8"/><path d="M3.5 14.5v2h13v-2"/></svg>
    </button>
    <button class="ib" id="theme" title="Sötét mód" aria-label="Sötét mód">
      <svg width="17" height="17" viewBox="0 0 20 20"><path d="M16.2 12.3A6.8 6.8 0 0 1 7.7 3.8a6.8 6.8 0 1 0 8.5 8.5z"/></svg>
    </button>
  </div>
</header>

<div class="bar">
  <button data-h="1" class="lbl" title="Címsor 1 (Ctrl+1)">H1</button>
  <button data-h="2" class="lbl" title="Címsor 2 (Ctrl+2)">H2</button>
  <div class="menu-wrap">
    <button id="hmore" aria-haspopup="true" aria-expanded="false" title="További címsorok">
      <svg width="13" height="13" viewBox="0 0 20 20"><path d="M5 8l5 5 5-5"/></svg>
    </button>
    <div class="menu" id="hmenu" hidden>
      <button data-h="1"><span class="h1">Címsor 1</span><kbd>Ctrl 1</kbd></button>
      <button data-h="2"><span class="h2">Címsor 2</span><kbd>Ctrl 2</kbd></button>
      <button data-h="3"><span class="h3">Címsor 3</span><kbd>Ctrl 3</kbd></button>
      <button data-h="4"><span class="h4">Címsor 4</span><kbd>Ctrl 4</kbd></button>
      <button data-h="5"><span class="h5">Címsor 5</span><kbd>Ctrl 5</kbd></button>
      <button data-h="6"><span class="h6">Címsor 6</span><kbd>Ctrl 6</kbd></button>
      <button data-h="0">Sima szöveg<kbd>Ctrl 0</kbd></button>
    </div>
  </div>
  <span class="sep"></span>
  <button data-wrap="**" class="lbl" style="font-weight:700" title="Félkövér (Ctrl+B)">B</button>
  <button data-wrap="*" class="lbl" style="font-style:italic;font-family:var(--serif)" title="Dőlt (Ctrl+I)">I</button>
  <button data-wrap="~~" class="lbl" style="text-decoration:line-through" title="Áthúzott">S</button>
  <span class="sep"></span>
  <button data-list="- " title="Felsorolás">
    <svg width="17" height="17" viewBox="0 0 20 20"><path d="M7 5.5h9M7 10h9M7 14.5h9"/><path d="M3.6 5.5h.01M3.6 10h.01M3.6 14.5h.01" stroke-width="2.4"/></svg>
  </button>
  <button data-list="1. " title="Számozott lista">
    <svg width="17" height="17" viewBox="0 0 20 20"><path d="M8 5.5h8M8 10h8M8 14.5h8"/><path d="M3 4.6l1.1-.6v3.1M3 13.2c0-1.4 2.2-1 2.2.2 0 .8-2.2 1.4-2.2 2.6h2.4"/></svg>
  </button>
  <button data-list="- [ ] " title="Feladatlista">
    <svg width="17" height="17" viewBox="0 0 20 20"><rect x="2.6" y="6" width="8" height="8" rx="1.6"/><path d="M13 10h4.4"/><path d="M4.6 10l1.4 1.4 2.6-2.8"/></svg>
  </button>
  <button data-list="> " title="Idézet">
    <svg width="17" height="17" viewBox="0 0 20 20"><path d="M3.4 4.5v11"/><path d="M7.5 6.5h9M7.5 10h9M7.5 13.5h6"/></svg>
  </button>
  <span class="sep"></span>
  <button id="link" title="Link (Ctrl+K)">
    <svg width="17" height="17" viewBox="0 0 20 20"><path d="M8.4 11.6a3 3 0 0 0 4.3 0l2.6-2.6a3 3 0 0 0-4.3-4.3l-1 1"/><path d="M11.6 8.4a3 3 0 0 0-4.3 0l-2.6 2.6a3 3 0 0 0 4.3 4.3l1-1"/></svg>
  </button>
  <button id="img" title="Kép">
    <svg width="17" height="17" viewBox="0 0 20 20"><rect x="2.6" y="4" width="14.8" height="12" rx="2"/><circle cx="7" cy="8.2" r="1.3"/><path d="M3.6 14l4-4 3.4 3.2 2.4-2 3 2.6"/></svg>
  </button>
  <button id="code" title="Kódblokk">
    <svg width="17" height="17" viewBox="0 0 20 20"><path d="M7 6.5L3.5 10 7 13.5M13 6.5L16.5 10 13 13.5"/></svg>
  </button>
  <button id="table" title="Táblázat">
    <svg width="17" height="17" viewBox="0 0 20 20"><rect x="2.6" y="4.2" width="14.8" height="11.6" rx="1.6"/><path d="M2.6 8.2h14.8M8 8.2v7.6"/></svg>
  </button>
  <span class="hint">Ctrl 1–6 · Ctrl B · Ctrl I · Ctrl K · Ctrl S</span>
</div>

<div class="main">
  <section class="pane" id="src">
    <div class="pane-head">
      <svg width="13" height="13" viewBox="0 0 20 20"><path d="M13.2 3.6l3.2 3.2L7 16.2H3.8v-3.2z"/></svg>
      Forrás
    </div>
    <div class="edit" id="editWrap">
      <div class="gutter"><div class="gutter-inner" id="gut"></div></div>
      <div class="field">
        <div class="mirror" id="mirror" aria-hidden="true"></div>
        <textarea id="ta" spellcheck="false" autocomplete="off" autocapitalize="off"
          aria-label="Markdown forrás"></textarea>
      </div>
      <div class="drop">Engedd el a .md fájlt a megnyitáshoz</div>
    </div>
  </section>
  <section class="pane" id="prev">
    <div class="pane-head">
      <svg width="13" height="13" viewBox="0 0 20 20"><path d="M1.8 10S4.9 4.8 10 4.8 18.2 10 18.2 10 15.1 15.2 10 15.2 1.8 10 1.8 10z"/><circle cx="10" cy="10" r="2.2"/></svg>
      Előnézet
    </div>
    <div class="preview" id="preview"><div class="doc-body" id="out"></div></div>
  </section>
</div>

<footer class="status">
  <span id="pos">1. sor, 1. oszlop</span>
  <span id="counts">0 szó · 0 karakter</span>
  <span id="store">Állapot: memóriában</span>
</footer>

<input type="file" id="file" accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain" hidden>

<script>
(function(){
"use strict";
var ta=document.getElementById("ta"), mirror=document.getElementById("mirror"),
    gut=document.getElementById("gut"), out=document.getElementById("out"),
    preview=document.getElementById("preview"), nameEl=document.getElementById("name"),
    dirtyEl=document.getElementById("dirty"), posEl=document.getElementById("pos"),
    countsEl=document.getElementById("counts");

/* ---------- markdown -> html ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function safeUrl(u){
  var t=u.trim().replace(/&quot;/g,"");
  if(/^\s*(javascript|vbscript|file):/i.test(t)) return "#";
  if(/^\s*data:/i.test(t) && !/^\s*data:image\//i.test(t)) return "#";
  return t;
}
function inline(s){
  var codes=[];
  s=s.replace(/`([^`]+)`/g,function(m,c){codes.push(c);return "\u0001"+(codes.length-1)+"\u0001";});
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^)]*)&quot;)?\)/g,function(m,a,u,t){
    return '<img src="'+safeUrl(u)+'" alt="'+a+'"'+(t?' title="'+t+'"':'')+'>';});
  s=s.replace(/\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^)]*)&quot;)?\)/g,function(m,a,u,t){
    return '<a href="'+safeUrl(u)+'" target="_blank" rel="noopener noreferrer"'+(t?' title="'+t+'"':'')+'>'+a+'</a>';});
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,function(m,p,u){
    return p+'<a href="'+safeUrl(u)+'" target="_blank" rel="noopener noreferrer">'+u+'</a>';});
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|\W)__([^_]+)__(?!\w)/g,"$1<strong>$2</strong>");
  s=s.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  s=s.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  s=s.replace(/(^|\W)_([^_\n]+)_(?!\w)/g,"$1<em>$2</em>");
  s=s.replace(/ {2,}$/,"<br>");
  s=s.replace(/\u0001(\d+)\u0001/g,function(m,i){return "<code>"+codes[+i]+"</code>";});
  return s;
}
var RE_LI=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/, RE_BLANK=/^\s*$/;
function isBlockStart(l){
  return RE_LI.test(l)||/^\s*#{1,6}\s/.test(l)||/^\s*>/.test(l)||
    /^\s*(?:```|~~~)/.test(l)||/^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l);
}
function listItems(lines,i){
  var items=[],m;
  while(i<lines.length){
    m=lines[i].match(RE_LI);
    if(m){ items.push({ind:m[1].replace(/\t/g,"  ").length, ord:/\d/.test(m[2]), txt:m[3]}); i++; }
    else if(RE_BLANK.test(lines[i]) && lines[i+1] && RE_LI.test(lines[i+1])) i++;
    else if(items.length && /^\s{2,}\S/.test(lines[i]) && !isBlockStart(lines[i])){
      items[items.length-1].txt+="\n"+lines[i].trim(); i++;
    } else break;
  }
  return [items,i];
}
function renderLists(items,st,ind){
  var h="";
  while(st.i<items.length && items[st.i].ind>=ind) h+=buildList(items,st,ind);
  return h;
}
function buildList(items,st,ind){
  var ord=items[st.i].ord, parts=[], it, sub, task, body;
  while(st.i<items.length && items[st.i].ind>=ind){
    if(items[st.i].ind===ind && items[st.i].ord!==ord) break;
    if(items[st.i].ind>ind){
      sub=renderLists(items,st,items[st.i].ind);
      if(parts.length) parts[parts.length-1]=parts[parts.length-1].replace(/<\/li>$/,sub+"</li>");
      else parts.push("<li>"+sub+"</li>");
      continue;
    }
    it=items[st.i]; st.i++;
    task=it.txt.match(/^\[([ xX])\]\s*(.*)$/);
    if(task){
      body=inline(esc(task[2]).replace(/\n/g," "));
      parts.push('<li class="task"><input type="checkbox" disabled'+
        (task[1].toLowerCase()==="x"?" checked":"")+"> "+body+"</li>");
    } else {
      parts.push("<li>"+inline(esc(it.txt).replace(/\n/g," "))+"</li>");
    }
  }
  return (ord?"<ol>":"<ul>")+parts.join("")+(ord?"</ol>":"</ul>");
}
function cells(row){
  var r=row.trim().replace(/^\|/,"").replace(/\|$/,"");
  return r.split("|").map(function(c){return c.trim();});
}
function mdToHtml(src){
  var lines=src.replace(/\r\n?/g,"\n").split("\n"), html="", i=0, l, m, buf, res, st;
  while(i<lines.length){
    l=lines[i];
    if(RE_BLANK.test(l)){i++;continue;}
    m=l.match(/^\s*(```|~~~)\s*([\w+#-]*)\s*$/);
    if(m){
      var fence=m[1], lang=m[2]; buf=[]; i++;
      while(i<lines.length && !new RegExp("^\\s*"+fence).test(lines[i])){buf.push(lines[i]);i++;}
      i++;
      html+="<pre><code"+(lang?' class="lang-'+lang+'"':"")+">"+esc(buf.join("\n"))+"</code></pre>";
      continue;
    }
    if(/^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l)){html+="<hr>";i++;continue;}
    m=l.match(/^\s*(#{1,6})\s+(.*?)\s*#*\s*$/);
    if(m){var n=m[1].length; html+="<h"+n+">"+inline(esc(m[2]))+"</h"+n+">"; i++; continue;}
    if(/^\s*>/.test(l)){
      buf=[];
      while(i<lines.length && !RE_BLANK.test(lines[i])){
        buf.push(lines[i].replace(/^\s*>\s?/,"")); i++;
      }
      html+="<blockquote>"+mdToHtml(buf.join("\n"))+"</blockquote>"; continue;
    }
    if(l.indexOf("|")>-1 && lines[i+1] && /^[\s|:-]+$/.test(lines[i+1]) && /-/.test(lines[i+1]) && lines[i+1].indexOf("|")>-1){
      var head=cells(l), align=cells(lines[i+1]).map(function(c){
        return /^:-+:$/.test(c)?"center":/-+:$/.test(c)?"right":/^:-+/.test(c)?"left":"";
      });
      i+=2;
      var t="<table><thead><tr>";
      head.forEach(function(c,k){t+="<th"+(align[k]?' style="text-align:'+align[k]+'"':"")+">"+inline(esc(c))+"</th>";});
      t+="</tr></thead><tbody>";
      while(i<lines.length && lines[i].indexOf("|")>-1 && !RE_BLANK.test(lines[i])){
        t+="<tr>";
        cells(lines[i]).forEach(function(c,k){
          t+="<td"+(align[k]?' style="text-align:'+align[k]+'"':"")+">"+inline(esc(c))+"</td>";});
        t+="</tr>"; i++;
      }
      html+=t+"</tbody></table>"; continue;
    }
    if(RE_LI.test(l)){
      res=listItems(lines,i); i=res[1]; st={i:0};
      html+=renderLists(res[0],st,res[0][0].ind); continue;
    }
    buf=[];
    while(i<lines.length && !RE_BLANK.test(lines[i]) && !isBlockStart(lines[i])){buf.push(lines[i]);i++;}
    if(buf.length) html+="<p>"+inline(esc(buf.join("\n")).replace(/\n/g," "))+"</p>";
  }
  return html;
}

/* ---------- kiemelés + sorszámok ---------- */
function hlLine(line,inCode){
  var s=esc(line);
  if(inCode||/^\s*(```|~~~)/.test(line)) return '<span class="hl-code">'+(s||"\u200b")+"</span>";
  if(/^\s*#{1,6}\s/.test(line)) return '<span class="hl-head">'+s+"</span>";
  if(/^\s*>/.test(line)) return '<span class="hl-quote">'+s+"</span>";
  if(/^\s{0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) return '<span class="hl-mark">'+s+"</span>";
  s=s.replace(/^(\s*)([-*+]|\d+[.)])(\s)/,'$1<span class="hl-mark">$2</span>$3');
  s=s.replace(/(\[[ xX]\])/,'<span class="hl-mark">$1</span>');
  s=s.replace(/(`[^`]+`)/g,'<span class="hl-code">$1</span>');
  s=s.replace(/(!?\[[^\]]*\]\([^)]*\))/g,'<span class="hl-link">$1</span>');
  s=s.replace(/(\*\*[^*]+\*\*|~~[^~]+~~)/g,'<span class="hl-mark">$1</span>');
  return s||"\u200b";
}
function paint(){
  var lines=ta.value.split("\n"), h="", inCode=false, i;
  for(i=0;i<lines.length;i++){
    if(/^\s*(```|~~~)/.test(lines[i])){h+="<div>"+hlLine(lines[i],true)+"</div>";inCode=!inCode;continue;}
    h+="<div>"+hlLine(lines[i],inCode)+"</div>";
  }
  mirror.innerHTML=h;
  var kids=mirror.children, g="";
  for(i=0;i<kids.length;i++) g+='<span style="top:'+kids[i].offsetTop+'px">'+(i+1)+"</span>";
  gut.innerHTML=g;
  syncScroll();
}
function syncScroll(){
  var y=ta.scrollTop;
  mirror.style.transform="translateY("+(-y)+"px)";
  gut.style.transform="translateY("+(-y)+"px)";
}

/* ---------- állapot ---------- */
var saved="", timer=null;
function stats(){
  var v=ta.value, words=v.trim()?v.trim().split(/\s+/).length:0;
  var mins=Math.max(1,Math.round(words/200));
  countsEl.textContent=words+" szó · "+v.length+" karakter"+(words?" · ~"+mins+" perc olvasás":"");
  var upto=v.slice(0,ta.selectionStart).split("\n");
  posEl.textContent=upto.length+". sor, "+(upto[upto.length-1].length+1)+". oszlop";
  dirtyEl.textContent=(v===saved)?"mentve":"nincs mentve";
}
function render(){ out.innerHTML=ta.value.trim()?mdToHtml(ta.value):'<p class="empty">Az előnézet itt jelenik meg.</p>'; }
function update(){
  paint(); stats();
  clearTimeout(timer); timer=setTimeout(render,150);
}

/* ---------- szövegbeszúrás (natív visszavonással) ---------- */
function put(text){
  ta.focus();
  var ok=false;
  try{ ok=document.execCommand("insertText",false,text); }catch(e){ ok=false; }
  if(!ok){
    var s=ta.selectionStart,e=ta.selectionEnd;
    ta.setRangeText(text,s,e,"end");
  }
  update();
}
function wrap(mark,placeholder){
  var s=ta.selectionStart, e=ta.selectionEnd, sel=ta.value.slice(s,e), body=sel||placeholder||"szöveg";
  var before=ta.value.slice(s-mark.length,s), after=ta.value.slice(e,e+mark.length);
  if(sel && before===mark && after===mark){
    ta.setSelectionRange(s-mark.length,e+mark.length);
    put(sel); ta.setSelectionRange(s-mark.length,e-mark.length); update(); return;
  }
  put(mark+body+mark);
  var end=ta.selectionStart-mark.length;
  ta.setSelectionRange(end-body.length,end);
  update();
}
function lineRange(){
  var v=ta.value, s=v.lastIndexOf("\n",ta.selectionStart-1)+1;
  var e=v.indexOf("\n",ta.selectionEnd); if(e<0) e=v.length;
  return [s,e];
}
function eachLine(fn){
  var r=lineRange(), v=ta.value.slice(r[0],r[1]);
  var res=v.split("\n").map(fn).join("\n");
  ta.setSelectionRange(r[0],r[1]);
  put(res);
}
function heading(n){
  eachLine(function(l){
    var t=l.replace(/^\s*#{1,6}\s+/,"").replace(/^\s+/,"");
    return n===0?t:new Array(n+1).join("#")+" "+t;
  });
}
function prefix(p){
  var strip=/^(\s*)(?:[-*+]\s\[[ xX]\]\s|[-*+]\s|\d+[.)]\s|>\s?)/;
  var r=lineRange(), src=ta.value.slice(r[0],r[1]).split("\n");
  var re=p==="1. "?/^\s*\d+[.)]\s/:p==="> "?/^\s*>\s?/:
         p==="- [ ] "?/^\s*[-*+]\s\[[ xX]\]\s/:/^\s*[-*+]\s(?!\[[ xX]\])/;
  var all=src.some(function(l){return l.trim();}) &&
          src.every(function(l){return !l.trim()||re.test(l);});
  var num=0;
  eachLine(function(l){
    var base=l.replace(strip,"$1");
    if(all) return base;
    if(!base.trim() && src.length>1) return base;
    num++;
    return base.replace(/^(\s*)/,"$1"+(p==="1. "?num+". ":p));
  });
}

/* ---------- események ---------- */
ta.addEventListener("input",update);
ta.addEventListener("scroll",function(){
  syncScroll();
  if(document.body.dataset.view!=="split") return;
  var max=ta.scrollHeight-ta.clientHeight;
  if(max<=0) return;
  preview.scrollTop=(ta.scrollTop/max)*(preview.scrollHeight-preview.clientHeight);
});
["click","keyup","select"].forEach(function(ev){ta.addEventListener(ev,stats);});
window.addEventListener("resize",paint);

ta.addEventListener("keydown",function(e){
  var mod=e.ctrlKey||e.metaKey;
  if(mod && !e.altKey){
    var k=e.key.toLowerCase();
    if(/^[0-6]$/.test(e.key)){e.preventDefault();heading(+e.key);return;}
    if(k==="b"){e.preventDefault();wrap("**","félkövér");return;}
    if(k==="i"){e.preventDefault();wrap("*","dőlt");return;}
    if(k==="k"){e.preventDefault();insertLink();return;}
    if(k==="s"){e.preventDefault();download();return;}
  }
  if(e.key==="Tab"){
    e.preventDefault();
    if(e.shiftKey) eachLine(function(l){return l.replace(/^ {1,2}/,"");});
    else if(ta.selectionStart!==ta.selectionEnd) eachLine(function(l){return "  "+l;});
    else put("  ");
    return;
  }
  if(e.key==="Enter" && !e.shiftKey){
    var v=ta.value, s=ta.selectionStart;
    if(s!==ta.selectionEnd) return;
    var line=v.slice(v.lastIndexOf("\n",s-1)+1,s);
    var m=line.match(/^(\s*)([-*+]|\d+[.)])\s+(\[[ xX]\]\s+)?(.*)$/);
    if(!m) return;
    e.preventDefault();
    if(!m[4].trim()){
      ta.setSelectionRange(s-line.length,s); put(m[1].slice(0,-2)||""); return;
    }
    var marker=/\d/.test(m[2])?(parseInt(m[2],10)+1)+m[2].slice(-1):m[2];
    put("\n"+m[1]+marker+" "+(m[3]?"[ ] ":""));
  }
});

document.querySelectorAll("[data-h]").forEach(function(b){

});
document.querySelectorAll("[data-wrap]").forEach(function(b){

    var m=b.dataset.wrap;
    wrap(m,m==="**"?"félkövér":m==="*"?"dőlt":"áthúzott");
  });
});
document.querySelectorAll("[data-list]").forEach(function(b){
  b.addEventListener("click",function(){prefix(b.dataset.list);});
});
function insertLink(){
  var s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e);
  if(/^https?:\/\//.test(sel)){ put("[]("+sel+")"); ta.setSelectionRange(s+1,s+1); update(); return; }
  var text=sel||"link szövege";
  put("["+text+"](https://)");
  ta.setSelectionRange(ta.selectionStart-1,ta.selectionStart-1);
}
document.getElementById("link").addEventListener("click",insertLink);
document.getElementById("img").addEventListener("click",function(){
  var sel=ta.value.slice(ta.selectionStart,ta.selectionEnd)||"leírás";
  put("!["+sel+"](https://)");
  ta.setSelectionRange(ta.selectionStart-1,ta.selectionStart-1);
});
document.getElementById("code").addEventListener("click",function(){
  var sel=ta.value.slice(ta.selectionStart,ta.selectionEnd);
  if(sel.indexOf("\n")<0 && sel){ wrap("`","kód"); return; }
  put("```\n"+(sel||"")+"\n```");
  if(!sel) ta.setSelectionRange(ta.selectionStart-4,ta.selectionStart-4);
  update();
});
document.getElementById("table").addEventListener("click",function(){

});

var themeBtn=document.getElementById("theme");

  document.documentElement.dataset.theme=dark?"light":"dark";
  themeBtn.title=dark?"Sötét mód":"Világos mód";
});
if(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
  document.documentElement.dataset.theme="dark";

function download(){
  var n=nameEl.value.trim()||"jegyzet.md";
  if(!/\.(md|markdown|txt)$/i.test(n)) n+=".md";
  var blob=new Blob([ta.value],{type:"text/markdown;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=n;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  saved=ta.value; stats();
}
document.getElementById("save").addEventListener("click",download);
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&document.activeElement!==ta){
    e.preventDefault();download();
  }
});

var fileInput=document.getElementById("file");
document.getElementById("open").addEventListener("click",function(){fileInput.click();});
fileInput.addEventListener("change",function(){
  if(fileInput.files[0]) loadFile(fileInput.files[0]);
  fileInput.value="";
});
function loadFile(f){
  var r=new FileReader();
  r.onload=function(){
    ta.value=r.result; saved=r.result; nameEl.value=f.name;
    update(); render(); ta.focus();
  };
  r.readAsText(f);
}
var wrapEl=document.getElementById("editWrap"), depth=0;
["dragenter","dragover"].forEach(function(ev){
  wrapEl.addEventListener(ev,function(e){e.preventDefault();document.body.classList.add("dragging");});
});
["dragleave","drop"].forEach(function(ev){
  wrapEl.addEventListener(ev,function(e){e.preventDefault();document.body.classList.remove("dragging");});
});
wrapEl.addEventListener("drop",function(e){
  if(e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
nameEl.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();nameEl.blur();}});
window.addEventListener("beforeunload",function(e){
  if(ta.value!==saved){e.preventDefault();e.returnValue="";}
});
